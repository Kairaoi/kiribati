services:
    app:
        env_file:
            - .env
        container_name: eregistry-app
        build:
            context: .
            dockerfile: Dockerfile.production
        restart: unless-stopped
        environment:
            APP_ENV: production
            APP_DEBUG: false
        depends_on:
            - mysql
            - redis
        volumes:
            - vite_assets:/var/www/html/public/build
            - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
            - dms-uploads:/var/www/html/storage/app/public
        logging:
            driver: json-file
            options:
              max-size: "10m"
              max-file: "3"
    mysql:
        container_name: eregistry-mysql
        image: mysql/mysql-server:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql-data:/var/lib/mysql
        logging:
            driver: json-file
            options:
              max-size: "10m"
              max-file: "3"
    queue:
        image: eregistry-app:production
        env_file:
            - .env
        working_dir: /var/www/html
        command: ["php", "artisan", "queue:work", "database", "--sleep=3", "-v"]
        restart: unless-stopped
        depends_on:
            - mysql
        stop_grace_period: 90s
        logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"

    nginx:
        image: nginx:alpine
        container_name: eregistry-nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/var/www/html
            - vite_assets:/var/www/html/public/build:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - /etc/ssl/cloudflare/digital-gov-ki.pem:/etc/ssl/cloudflare/digital-gov-ki.pem:ro
            - /etc/ssl/cloudflare/digital-gov-ki.key:/etc/ssl/cloudflare/digital-gov-ki.key:ro
        depends_on:
            - app
        networks:
            - default
        logging:
            driver: json-file
            options:
              max-size: "10m"
              max-file: "3"

    redis:
        image: redis:alpine
        restart: unless-stopped

volumes:
    mysql-data:
    vite_assets:
    dms-uploads: